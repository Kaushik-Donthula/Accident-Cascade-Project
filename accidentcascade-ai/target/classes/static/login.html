<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | AccidentCascade AI</title>
  <style>:root{--ink:#eaf2ff;--muted:#a7b9d4;--line:#ffffff28;--cyan:#34d2d0;--blue:#6e9cff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071224;color:var(--ink);font:16px Inter,Segoe UI,Arial,sans-serif}.shell{width:min(1020px,calc(100% - 40px));display:grid;grid-template-columns:1.15fr .85fr;background:#0f1d33;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px #0008}.intro{min-height:610px;padding:54px;background-image:linear-gradient(90deg,#071426df,#07142660),url('assets/himalaya-disaster-hero.png');background-size:cover;background-position:center;color:#fff}.mark{display:inline-block;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#061020;font-weight:900;border-radius:9px;padding:8px;font-size:12px}.eyebrow{margin:66px 0 10px;color:#8cf4ef;font-size:11px;font-weight:800;letter-spacing:1.7px}.intro h1{font-size:43px;line-height:1.06;letter-spacing:-1.3px;margin:0 0 16px}.intro p:not(.eyebrow){max-width:370px;color:#d4e1f5;line-height:1.65}.form{padding:56px 48px;background:linear-gradient(150deg,#12233d,#0c182b)}.form h2{margin:0 0 8px;font-size:28px}.form>p{color:var(--muted);margin:0 0 30px;line-height:1.5}label{display:block;font-size:12px;font-weight:800;color:#c6d7f1;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #3e5577;border-radius:8px;background:#091629;color:#fff;font:inherit}button{width:100%;margin-top:25px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#061020;padding:13px;font-weight:900;font-size:15px;cursor:pointer}.error{min-height:20px;color:#ffb6bc;margin-top:12px;font-size:13px}@media(max-width:720px){.shell{grid-template-columns:1fr}.intro{min-height:auto;padding:36px}.intro h1{font-size:34px}.eyebrow{margin:34px 0 10px}.form{padding:36px 30px}}</style>
</head>
<body>
  <section class="shell"><div class="intro"><span class="mark">AC</span><p class="eyebrow">GLOBAL DISASTER INTELLIGENCE</p><h1>See the signal.<br>Protect the region.</h1><p>Sign in to monitor early warnings for earthquakes, landslides, and floods across Nepal and North India.</p></div><div class="form"><h2>Welcome back</h2><p>Access the AccidentCascade AI global response dashboard.</p><form id="login-form"><label>Email<input type="email" name="email" value="admin@accidentcascade.ai" required></label><label>Password<input type="password" name="password" value="Accident@123" required></label><button type="submit">Sign in to dashboard</button><div id="error" class="error" role="alert"></div></form></div></section>
  <script src="login.js?v=20260916-graphics"></script>
</body></html>
